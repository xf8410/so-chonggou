[package]
name = "hachimi_chonggou"
version = "0.2.0"
edition = "2021"

# 产物名 libhachimi_chonggou.so —— 命中宿主自动扫描前缀 libhachimi_
[lib]
name = "hachimi_chonggou"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1

[dependencies]
log = "0.4"
once_cell = "1.19"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
android_logger = "0.15.1"
# 仅独立模式需要；插件模式下绝不使用（避免第二套 inline hook 引擎）
dobby-rs = "0.1"

# 与 Hachimi-Edge 相同的 dobby 补丁 —— crates.io 版在 android 目标编不过
[patch.crates-io]
dobby-sys = { git = "https://github.com/LeadRDRK/dobby-sys.git", rev = "e005f6abb0db1353b92ff58d50f59112f04dcad4" }
