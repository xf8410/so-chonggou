name: Build SO

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests (guard / logging / config / denylist)
        run: cargo test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Ensure NDK (prefer preinstalled, fallback sdkmanager)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "no preinstalled ndk dir"
          sdkmanager --install "ndk;27.2.12479018" || echo "sdkmanager install failed — trying preinstalled"
          ls "$ANDROID_HOME/ndk" 2>/dev/null

      - name: Build (arm64-v8a)
        run: cargo ndk -t arm64-v8a -p 21 -o jniLibs build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhachimi_chonggou.so
          path: jniLibs/arm64-v8a/libhachimi_chonggou.so
