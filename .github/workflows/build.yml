name: Build SO

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests (guard / logging / config / denylist)
        run: cargo test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Locate / install NDK (explicit, fail loud)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "-- preinstalled NDK list --"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || echo "(none)"
          if [ -z "$(ls "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            SDKM=$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n1)
            echo "sdkmanager: $SDKM"
            if [ -z "$SDKM" ]; then echo "FATAL: no sdkmanager found"; exit 1; fi
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" --install "ndk;27.2.12479018"
          fi
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -n1)
          if [ -z "$NDK_DIR" ]; then echo "FATAL: no NDK found after install"; exit 1; fi
          echo "Using NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build (arm64-v8a)
        run: cargo ndk -t arm64-v8a -p 21 -o jniLibs build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhachimi_chonggou.so
          path: jniLibs/arm64-v8a/libhachimi_chonggou.so
